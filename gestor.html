<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso da Equipe — SertCode</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo-symbol.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css?v=13">
</head>
<body>

<div class="login-page">
  <div class="login-glow"></div>

  <div class="login-card" id="login-card">

    <div class="login-brand">
      <img src="assets/logo-symbol.png" alt="SertCode" width="36">
      <span class="login-brand-text">Sert<em>Code</em></span>
    </div>

    <div class="login-badge">🔒 Acesso restrito — Equipe SertCode</div>

      <div class="login-title">Painel da equipe</div>
      <div class="login-sub">Gestão de clientes, assinaturas e chamados.</div>

      <form class="login-form" id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" placeholder="voce@exemplo.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-pass">Senha</label>
          <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Acessar painel
        </button>
        <div class="form-msg" id="login-msg" role="alert"></div>
      </form>


    <div class="login-note">
      Acesso criado por um gestor da SertCode. Seus dados são usados apenas para
      identificar você na equipe, conforme a <a href="privacidade.html">política de privacidade</a>.
    </div>

    <a href="cliente.html" class="login-back">← Área do Cliente</a>
  </div>
</div>

<script type="module">
import { supabase } from './js/supabase.js'

const $ = id => document.getElementById(id);

/* ── MOSTRAR / OCULTAR SENHA ── */
const EYE     = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
document.querySelectorAll('.login-form input[type="password"]').forEach(input => {
  const wrap = document.createElement('div');
  wrap.className = 'pass-wrap';
  input.replaceWith(wrap);
  wrap.appendChild(input);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pass-toggle';
  btn.innerHTML = EYE;
  btn.setAttribute('aria-label', 'Mostrar senha');
  btn.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? EYE_OFF : EYE;
    btn.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
    input.focus();
  });
  wrap.appendChild(btn);
});

function setMsg(el, text, type = 'error') {
  el.textContent = text;
  el.className = 'form-msg show ' + type;
}
function clearMsg(el) { el.className = 'form-msg'; el.textContent = ''; }

/* ── ENTRAR ── */
$('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = $('login-msg'), btn = $('login-btn'), orig = btn.innerHTML;
  const email = $('login-email').value.trim(), password = $('login-pass').value;
  clearMsg(msg);
  if (!email || !password) return setMsg(msg, 'Informe e-mail e senha.');

  btn.innerHTML = 'Verificando...'; btn.disabled = true;
  const done = () => { btn.innerHTML = orig; btn.disabled = false; };

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if (error) {
    done();
    return setMsg(msg, /confirm/i.test(error.message)
      ? 'Confirme seu e-mail pelo link que enviamos antes de entrar.'
      : 'E-mail ou senha incorretos.');
  }

  const { data: profile } = await supabase
    .from('profiles').select('*').eq('id', data.user.id).single();

  const isTeam = ['gestor', 'colaborador'].includes(profile?.role);
  const status = profile?.status ?? 'ativo';
  if (isTeam && status === 'ativo') { window.location.href = 'painel.html'; return; }

  await supabase.auth.signOut();
  done();
  if (!isTeam)                          return setMsg(msg, 'Acesso negado. Este acesso é exclusivo da equipe SertCode.');
  if (status === 'pendente')            return setMsg(msg, 'Sua solicitação ainda está em análise. Você será avisado quando o acesso for liberado.', 'info');
  setMsg(msg, 'Seu acesso está desativado. Fale com um gestor da SertCode.');
});

</script>

</body>
</html>
