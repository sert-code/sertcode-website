<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SertCode — stories dos destaques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--preto:#050505;--laranja:#FF6A00;--brilho:#FF8A00;--escuro:#D94A00;
        --texto:#F2F2F2;--suave:#9A9A9A}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

  /* 1080x1920. O Instagram cobre o topo com as barrinhas e o perfil, e o
     rodapé com a caixa de resposta: o conteúdo vive entre 300 e 1620px. */
  .story{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:var(--preto);color:var(--texto);
    padding:300px 92px 320px;display:flex;flex-direction:column}
  body:not(.todos) .story{display:none}
  body:not(.todos) .story.ativo{display:flex}
  /* A folha de contato escala o story inteiro em vez de encolher a caixa:
     reduzir width/height manteria os tipos no tamanho original e o
     conteúdo transbordaria, mostrando um recorte em vez da miniatura. */
  /* Float em vez de flex: com zoom, o flex-basis ainda é resolvido no
     tamanho original (1080px) e só caberia um por linha. */
  body.todos{padding:16px;background:#1a1a1a;display:flow-root}
  body.todos .story{zoom:.25;float:left;margin:0 32px 32px 0}

  /* Faixas que marcam o que a interface do Instagram cobre; só com ?guia=1. */
  .guia{position:absolute;left:0;right:0;background:rgba(255,0,80,.14);
    border:1px dashed rgba(255,0,80,.4);display:none;z-index:9}
  .guia.alto{top:0;height:300px} .guia.baixo{bottom:0;height:320px}
  body.guia .guia{display:block}

  .aurora{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(46% 24% at 86% 10%, rgba(255,138,0,.20), transparent 70%),
               radial-gradient(40% 22% at 6% 92%, rgba(217,74,0,.15), transparent 70%)}
  .conteudo{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
  /* A marca fica no alto e o rodapé embaixo; o miolo ocupa o resto e
     centra o texto nele. Sem isso o conteúdo encosta no topo e sobra
     um vazio grande no meio da tela. */
  .miolo{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

  .marca{display:flex;align-items:center;gap:15px;margin-bottom:46px}
  .marca img{width:50px;height:50px}
  .marca span{font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:600}
  .marca b{font-weight:700;background:linear-gradient(90deg,var(--brilho),var(--escuro));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}

  .etiqueta{display:inline-flex;align-items:center;gap:11px;align-self:flex-start;
    padding:11px 22px;border-radius:999px;border:1px solid rgba(255,106,0,.3);
    background:rgba(255,106,0,.08);color:var(--laranja);
    font-size:19px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;margin-bottom:34px}
  .etiqueta i{width:9px;height:9px;border-radius:50%;background:var(--laranja)}

  h1{font-family:'Space Grotesk',sans-serif;font-size:88px;font-weight:700;
     line-height:1.05;letter-spacing:-.025em}
  h2{font-family:'Space Grotesk',sans-serif;font-size:62px;font-weight:700;
     line-height:1.12;letter-spacing:-.02em;margin-bottom:32px}
  .destaque{background:linear-gradient(90deg,var(--brilho),var(--escuro));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent}
  p{font-size:33px;line-height:1.6;color:var(--suave)}
  p+p{margin-top:26px}
  p strong{color:var(--texto);font-weight:600}

  .lista{list-style:none;display:flex;flex-direction:column;gap:26px;margin-top:6px}
  .lista li{display:flex;gap:20px;align-items:flex-start;font-size:32px;line-height:1.42}
  .lista i{width:13px;height:13px;flex-shrink:0;margin-top:13px;transform:rotate(45deg);
    background:linear-gradient(135deg,var(--brilho),var(--escuro))}
  .lista b{display:block;font-weight:600;color:var(--texto)}
  .lista small{display:block;font-size:26px;color:var(--suave);margin-top:5px;line-height:1.45}

  .centro{justify-content:center;text-align:center;align-items:center}
  .centro .conteudo{justify-content:center;align-items:center;text-align:center}
  .simbolo{width:150px;margin-bottom:52px;filter:drop-shadow(0 0 60px rgba(255,106,0,.45))}

  /* ── número da fase ── */
  .fase{display:flex;align-items:center;gap:26px;margin-bottom:34px}
  .fase b{width:108px;height:108px;flex-shrink:0;border-radius:30px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--brilho),var(--escuro));color:#fff;
    font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:700}
  .fase span{font-size:25px;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;color:var(--laranja)}

  /* ── pergunta ── */
  .pergunta{font-family:'Space Grotesk',sans-serif;font-size:54px;font-weight:700;
    line-height:1.18;margin-bottom:30px}
  .marcador{display:block;font-size:92px;line-height:.8;color:var(--laranja);
    opacity:.35;margin-bottom:12px;font-family:'Space Grotesk',sans-serif}

  /* ── contato ── */
  .canais{display:flex;flex-direction:column;gap:22px;width:100%;margin-top:14px}
  .canal{display:flex;align-items:center;gap:24px;padding:34px 36px;border-radius:26px;
    border:1px solid rgba(255,106,0,.26);background:rgba(255,106,0,.05);text-align:left}
  .canal.cheio{background:linear-gradient(90deg,var(--brilho),var(--escuro));border-color:transparent}
  .canal svg{width:46px;height:46px;flex-shrink:0;stroke:var(--laranja);fill:none;
    stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .canal.cheio svg{stroke:#fff}
  .canal b{display:block;font-size:33px;font-weight:700}
  .canal small{display:block;font-size:26px;color:var(--suave);margin-top:4px}
  .canal.cheio small{color:rgba(255,255,255,.82)}

  .rodape{margin-top:auto;padding-top:44px;display:flex;align-items:center;
    justify-content:space-between;gap:20px}
  .site{font-size:26px;color:var(--suave)}
  .passo-conta{font-family:'Space Grotesk',sans-serif;font-size:26px;
    font-weight:600;color:#3A3A3A}
</style>
</head>

/* ── moldes ── */
const marca = `<div class="marca"><img src="../assets/logo-symbol.png" alt=""><span>Sert<b>Code</b></span></div>`;
const etiqueta = t => t ? `<div class="etiqueta"><i></i>${t}</div>` : '';
const rodape = (t, n, total) => `<div class="rodape">
  <span class="site">${t || 'sertcode.com.br'}</span>
  <span class="passo-conta">${n}/${total}</span></div>`;

function montar(s, n, total) {
  if (s.tipo === 'capa') return `
    <div class="aurora"></div>
    <div class="conteudo" style="justify-content:center;align-items:center;text-align:center">
      <img class="simbolo" src="../assets/logo-symbol.png" alt="">
      <h1>${s.titulo}</h1>
      <p style="margin-top:30px">${s.sub}</p>
    </div>`;

  if (s.tipo === 'retrato') return `
    <div class="aurora"></div>
    <div class="conteudo">
      ${marca}
      <div class="miolo">
      ${etiqueta(s.etiqueta)}
      <figure style="position:relative;width:330px;margin:26px 0 40px">
        <span style="position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(circle at 50% 42%,rgba(255,138,0,.38),rgba(255,106,0,.12) 46%,transparent 72%)"></span>
        <img src="../assets/roseanne-souza.webp" alt="Roseanne N. Souza"
          style="position:relative;display:block;width:100%;height:auto;aspect-ratio:1/1;
                 object-fit:cover;object-position:50% 14%;border-radius:50%;
                 -webkit-mask-image:radial-gradient(circle,#000 67%,transparent 99%)">
      </figure>
      <h2 style="margin-bottom:18px">${s.nome}</h2>
      <div style="display:inline-flex;align-self:flex-start;align-items:center;gap:12px;
        padding:13px 26px;border-radius:999px;margin-bottom:24px;
        background:linear-gradient(90deg,var(--brilho),var(--escuro));color:#fff;
        font-size:24px;font-weight:700">${s.cargo}</div>
      <div class="destaque" style="font-size:29px;font-weight:600;margin-bottom:26px">${s.formacao}</div>
      <p>${s.texto}</p>
      </div>
      ${rodape(null, n, total)}
    </div>`;

  if (s.tipo === 'texto') return `
    <div class="aurora"></div>
    <div class="conteudo">
      ${marca}
      <div class="miolo">
        ${etiqueta(s.etiqueta)}
        <h2>${s.titulo}</h2>
        ${s.textos.map(t => `<p>${t}</p>`).join('')}
      </div>
      ${rodape(s.rodape, n, total)}
    </div>`;

  if (s.tipo === 'lista') return `
    <div class="aurora"></div>
    <div class="conteudo">
      ${marca}
      <div class="miolo">
        ${etiqueta(s.etiqueta)}
        <h2>${s.titulo}</h2>
        <ul class="lista">${s.itens.map(i =>
          `<li><i></i><span><b>${i.b}</b><small>${i.s}</small></span></li>`).join('')}</ul>
        ${s.nota ? `<p style="margin-top:34px;font-size:28px">${s.nota}</p>` : ''}
      </div>
      ${rodape(null, n, total)}
    </div>`;

  if (s.tipo === 'fase') return `
    <div class="aurora"></div>
    <div class="conteudo">
      ${marca}
      <div class="miolo">
        <div class="fase"><b>${s.n}</b><span>${s.nome}</span></div>
        <h2>${s.titulo}</h2>
        <p>${s.texto}</p>
      </div>
      ${rodape(null, n, total)}
    </div>`;

  if (s.tipo === 'pergunta') return `
    <div class="aurora"></div>
    <div class="conteudo">
      ${marca}
      <div class="miolo">
        <span class="marcador">?</span>
        <div class="pergunta">${s.p}</div>
        ${s.r.map(t => `<p>${t}</p>`).join('')}
      </div>
      ${rodape(s.rodape, n, total)}
    </div>`;

  if (s.tipo === 'contato') return `
    <div class="aurora"></div>
    <div class="conteudo">
      ${marca}
      <div class="miolo">
        ${etiqueta(s.etiqueta)}
        <h2>${s.titulo}</h2>
        <div class="canais">${s.canais.map(c => `
          <div class="canal${c.cheio ? ' cheio' : ''}">
            <svg viewBox="0 0 24 24" aria-hidden="true">${c.icone}</svg>
            <span><b>${c.b}</b><small>${c.s}</small></span>
          </div>`).join('')}</div>
      </div>
      ${rodape(null, n, total)}
    </div>`;

  return '';
}

const palco = document.getElementById('palco');
palco.innerHTML = Object.entries(DESTAQUES).flatMap(([id, telas]) =>
  telas.map((s, i) => `
    <section class="story${s.tipo === 'capa' ? ' centro' : ''}" data-id="${id}-${i + 1}">
      <div class="guia alto"></div><div class="guia baixo"></div>
      ${montar(s, i + 1, telas.length)}
    </section>`)).join('');

const p = new URLSearchParams(location.search);
if (p.get('guia')) document.body.classList.add('guia');
const alvo = p.get('s');
if (alvo === 'todos') document.body.classList.add('todos');
else document.querySelector('.story[data-id="' + (alvo || 'quem-somos-1') + '"]')?.classList.add('ativo');

// O gerador lê daqui quantas telas cada destaque tem.
window.__mapa = Object.fromEntries(Object.entries(DESTAQUES).map(([k, v]) => [k, v.length]));
</script>
</body>
</html>
